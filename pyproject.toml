[tool.ruff]
# Максимальная длина строки (стандарт PEP 8 — 88, но для веба часто ставят 100-120)
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Выбираем базовые правила: E (ошибки), F (проблемы), I (сортировка импортов)
select = ["E", "F", "I"]
# Игнорируем самые частые ошибки в уже написанном коде:
# E501 - слишком длинная строка
# F401 - неиспользуемый импорт
# F841 - неиспользуемая переменная
ignore = ["E501", "F401", "F841"]
