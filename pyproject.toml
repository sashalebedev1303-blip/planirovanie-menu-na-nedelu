[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",   # Слишком длинная строка
    "F401",   # Импорт есть, но не используется
    "F841",   # Переменная создана, но не используется
    "I001",   # Импорты не отсортированы
    "BLE001", # Перехват слишком общего Exception
    "S112"    # try-except-continue
]

