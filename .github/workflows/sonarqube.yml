name: SonarQube Analysis

# ЛР-8, дополнительная верификация: прогон настоящего SonarQube
# (Community Build) в GitHub Actions — сервер поднимается контейнером
# на раннере, анализ выполняется там же, метрики выгружаются артефактом.
#
# Запуск: вручную (Actions -> SonarQube Analysis -> Run workflow)
#         или автоматически при push в ветку ЛР-8.
# Результаты: artifacts прогона (measures-*.json, issues-*.json, мнения).

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lab8-quality-debt
    paths:
      - '.github/workflows/sonarqube.yml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/code_metrics.py'

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Community Build на раннере
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Параметры ядра для Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Запуск сервера SonarQube в контейнере
        run: |
          set -e
          IMAGE=""
          for tag in lts-community community latest; do
            echo "Пробую образ sonarqube:$tag"
            if docker pull "sonarqube:$tag"; then
              IMAGE="sonarqube:$tag"
              break
            fi
          done
          if [ -z "$IMAGE" ]; then
            echo "::error::не удалось скачать образ SonarQube"
            exit 1
          fi
          echo "SONAR_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            -v sonarqube_data:/opt/sonarqube/data \
            -v sonarqube_logs:/opt/sonarqube/logs \
            -v sonarqube_extensions:/opt/sonarqube/extensions \
            "$IMAGE"
          echo "Запущен образ: $IMAGE"

      - name: Ожидание готовности сервера
        run: |
          for i in $(seq 1 90); do
            status=$(curl -s --max-time 5 http://localhost:9000/api/system/status || true)
            echo "[$i] $status"
            case "$status" in
              *'"status":"UP"'*) echo "SonarQube готов к работе"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::SonarQube не поднялся за отведённое время"
          docker logs sonarqube | tail -n 120
          docker ps -a
          exit 1

      - name: Смена пароля admin, создание проекта и токена
        run: |
          set -e
          PASS='Lab8SonarPass2026'
          curl -sf -u admin:admin -X POST "http://localhost:9000/api/users/change_password" \
            --data-urlencode "login=admin" \
            --data-urlencode "previousPassword=admin" \
            --data-urlencode "password=$PASS"
          curl -sf -u "admin:$PASS" -X POST "http://localhost:9000/api/projects/create" \
            --data-urlencode "project=tastyweek" \
            --data-urlencode "name=TastyWeek"
          TOKEN=$(curl -sf -u "admin:$PASS" -X POST "http://localhost:9000/api/user_tokens/generate" \
            --data-urlencode "name=lab8-ci" | jq -r '.token')
          test -n "$TOKEN" -a "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "SONAR_PASS=$PASS" >> "$GITHUB_ENV"
          echo "Проект tastyweek создан, токен сгенерирован"

      - name: Python и зависимости
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей и прогон тестов
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r src/requirements.txt
          pytest -q

      - name: Запуск сканера SonarQube
        run: |
          docker run --rm --network host \
            -e SONAR_HOST_URL=http://localhost:9000 \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "$PWD:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey=tastyweek \
            -Dsonar.projectName=TastyWeek \
            -Dsonar.projectBaseDir=/usr/src \
            -Dsonar.working.directory=/tmp/scannerwork \
            -Dsonar.sources=src \
            -Dsonar.tests=tests \
            -Dsonar.sourceEncoding=UTF-8

      - name: Ожидание обработки отчёта сервером
        run: |
          set -e
          for i in $(seq 1 60); do
            body=$(curl -s -u "admin:$SONAR_PASS" "http://localhost:9000/api/ce/component?component=tastyweek")
            status=$(echo "$body" | jq -r '.current.status // "none"')
            echo "[$i] Compute Engine: $status"
            if [ "$status" = "SUCCESS" ]; then
              echo "Отчёт обработан сервером"
              exit 0
            fi
            if [ "$status" = "FAILED" ] || [ "$status" = "CANCELED" ]; then
              echo "::error::сервер не смог обработать отчёт"
              echo "$body" | jq .
              exit 1
            fi
            sleep 5
          done
          echo "::error::сервер не обработал отчёт за отведённое время"
          exit 1

      - name: Выгрузка метрик через API
        run: |
          set -e
          mkdir -p artifacts
          KEYS='bugs,vulnerabilities,code_smells,security_hotspots,duplicated_lines_density,duplicated_lines,duplicated_blocks,duplicated_files,ncloc,sqale_index,sqale_debt_ratio,complexity,cognitive_complexity,reliability_rating,security_rating,sqale_rating,blocker_violations,critical_violations,major_violations,minor_violations,info_violations'
          curl -sf -u "admin:$SONAR_PASS" -G "http://localhost:9000/api/measures/component" \
            --data-urlencode "component=tastyweek" \
            --data-urlencode "metricKeys=$KEYS" \
            -o artifacts/measures.json
          if [ "$(jq '.component.measures | length' artifacts/measures.json)" -eq 0 ]; then
            echo "::error::метрики пусты — анализ не проиндексирован"
            cat artifacts/measures.json
            exit 1
          fi
          curl -sf -u "admin:$SONAR_PASS" -G "http://localhost:9000/api/measures/component_tree" \
            --data-urlencode "component=tastyweek" \
            --data-urlencode "metricKeys=ncloc,complexity,cognitive_complexity,code_smells,duplicated_lines_density,duplicated_blocks" \
            --data-urlencode "ps=500" \
            -o artifacts/measures-tree.json
          curl -sf -u "admin:$SONAR_PASS" -G "http://localhost:9000/api/issues/search" \
            --data-urlencode "componentKeys=tastyweek" \
            --data-urlencode "types=CODE_SMELL" \
            --data-urlencode "ps=500" \
            -o artifacts/issues-code-smells.json
          curl -sf -u "admin:$SONAR_PASS" -G "http://localhost:9000/api/issues/search" \
            --data-urlencode "componentKeys=tastyweek" \
            --data-urlencode "facets=rules,severities,types" \
            --data-urlencode "ps=1" \
            -o artifacts/issues-summary.json
          echo "Версия сервера:"
          curl -s http://localhost:9000/api/server/version
          echo
          echo "Ключевые метрики:"
          jq -r '.component.measures[]? | "\(.metric): \(.value // "-")"' artifacts/measures.json

      - name: Сохранение результатов прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-measures
          path: artifacts/*.json
          retention-days: 90

      - name: Логи сервера при ошибке
        if: failure()
        run: |
          docker logs sonarqube | tail -n 200 || true
