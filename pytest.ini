[pytest]
# ЛР-7: покрытие ключевой вычислительной логики измеряется при каждом запуске.
# Порог 60% зафиксирован в конфигурации запуска (--cov-fail-under): тесты
# проваливаются, если покрытие ключевых модулей упадёт ниже порога.
addopts = --cov=shopping_calc --cov=quantity --cov-report=term-missing --cov-fail-under=60
