# Расширенный профиль статического анализа для ЛР-8 (метрики качества).
# Основной ruff.toml (CI) остаётся мягким — зелёная сборка не должна ломаться.
# Этот профиль включается вручную/в отчёте ЛР-8 и показывает потенциальные
# code smells: запускается командой
#     python -m ruff check src --config ruff-strict.toml
line-length = 120
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle: ошибки стиля
    "W",    # pycodestyle: предупреждения (в т.ч. неиспользуемые импорты/переменные)
    "F",    # pyflakes: логические ошибки
    "I",    # isort: сортировка импортов
    "B",    # bugbear: вероятные баги
    "C4",   # comprehensions: однострочные конструкции вместо циклов
    "SIM",  # sim: упрощаемые конструкции (if-else, избыточные ветки)
    "RET",  # return: упрощение return
    "ARG",  # unused-arguments: неиспользуемые параметры
    "RUF",  # ruff-специфичные правила
]
ignore = [
    "E501",   # слишком длинные строки — допустимо (HTML-шаблон в main.py)
    "E402",   # импорт uvicorn в конце main.py (запуск приложения)
    "RUF001", # «неоднозначные» юникод-символы — ложные срабатывания на
    "RUF002", #   кириллицу и тире «—» в строках/докстрингах/комментариях:
    "RUF003", #   русский текст проекта использует их намеренно
]

[lint.per-file-ignores]
# В GUI-строке HTML/JS много ложных срабатываний строковых правил
"src/main.py" = ["W605"]
